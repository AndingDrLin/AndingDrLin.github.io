name: PR Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'templates/**'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'templates/**'

jobs:
  check:
    name: Validate & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Validate frontmatter
        run: npm run validate

      - name: Type check
        run: npx astro check

      - name: Build check
        if: github.event_name == 'pull_request'
        run: npm run build
