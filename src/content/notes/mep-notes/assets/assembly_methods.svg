<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-label="Wire bonding TAB and flip chip comparison">
  <style>.base{fill:#e2e8f0;stroke:#475569}.die{fill:#dbeafe;stroke:#1d4ed8;stroke-width:2}.txt{font:15px Arial;fill:#0f172a}.title{font:600 18px Arial;fill:#0f172a}.wire{stroke:#f59e0b;stroke-width:3;fill:none}.bump{fill:#f97316;stroke:#9a3412}.tape{fill:#fde68a;stroke:#b45309}.lead{stroke:#b45309;stroke-width:4}</style>
  <text class="title" x="105" y="35">Wire bonding</text><rect class="base" x="55" y="240" width="240" height="35"/><rect class="die" x="125" y="165" width="100" height="55"/><path class="wire" d="M135 165 C95 110, 70 185, 70 240"/><path class="wire" d="M215 165 C255 110, 280 185, 280 240"/><text class="txt" x="72" y="310">cheap, flexible, mature</text><text class="txt" x="80" y="332">long wires limit speed/I/O</text>
  <text class="title" x="425" y="35">TAB</text><rect class="base" x="365" y="240" width="240" height="35"/><rect class="die" x="435" y="165" width="100" height="55"/><rect class="tape" x="380" y="125" width="210" height="28"/><line class="lead" x1="415" y1="153" x2="455" y2="165"/><line class="lead" x1="555" y1="153" x2="515" y2="165"/><text class="txt" x="388" y="310">automated fine-pitch tape</text><text class="txt" x="390" y="332">higher process/tool requirement</text>
  <text class="title" x="735" y="35">Flip-chip</text><rect class="base" x="675" y="240" width="240" height="35"/><rect class="die" x="745" y="130" width="100" height="55"/><circle class="bump" cx="760" cy="205" r="8"/><circle class="bump" cx="795" cy="205" r="8"/><circle class="bump" cx="830" cy="205" r="8"/><line class="lead" x1="760" y1="213" x2="760" y2="240"/><line class="lead" x1="795" y1="213" x2="795" y2="240"/><line class="lead" x1="830" y1="213" x2="830" y2="240"/><text class="txt" x="692" y="310">short path, high I/O, better thermal</text><text class="txt" x="710" y="332">needs bumps/substrate/underfill</text>
</svg>
