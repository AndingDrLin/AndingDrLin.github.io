<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" role="img" aria-label="Anti-parallel SCR waveform alpha greater than 90 degrees">
  <style>
    .axis{stroke:#333;stroke-width:2}
    .grid{stroke:#eee;stroke-width:1}
    .vsine{fill:none;stroke:#aaa;stroke-width:1.8;stroke-dasharray:6 4}
    .current{fill:none;stroke:#c62828;stroke-width:3.5}
    .conduct{fill:#c62828;fill-opacity:0.08;stroke:none}
    .conduct2{fill:#1565c0;fill-opacity:0.08;stroke:none}
    .vert{stroke:#c62828;stroke-width:1.5;stroke-dasharray:5 4}
    .vert2{stroke:#1565c0;stroke-width:1.5;stroke-dasharray:5 4}
    .txt{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#222}
    .label{font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#555}
    .accent{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#c62828}
    .blue-label{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#1565c0}
    .note{font-family:Arial,Helvetica,sans-serif;font-size:12px;fill:#888}
    .arc{stroke:#c62828;stroke-width:1.5;fill:none}
    .arc2{stroke:#1565c0;stroke-width:1.5;fill:none}
  </style>

  <rect width="720" height="440" fill="white"/>

  <!-- Title -->
  <text class="txt" x="360" y="28" text-anchor="middle" font-size="16px">Anti-parallel SCR Current Waveform (alpha &gt; 90deg, R Load)</text>
  <text class="note" x="360" y="46" text-anchor="middle">alpha = 120deg example: feng lian SCR dian liu bo xing</text>

  <!-- ====== Upper plot: v_s and v_o ====== -->
  <!-- Axes -->
  <line class="axis" x1="60" y1="160" x2="680" y2="160"/>
  <line class="axis" x1="60" y1="60" x2="60" y2="250"/>

  <text class="txt" x="30" y="115">v</text>
  <text class="txt" x="665" y="180">wt</text>

  <line class="grid" x1="60" y1="110" x2="680" y2="110"/>
  <line class="grid" x1="60" y1="210" x2="680" y2="210"/>

  <text class="note" x="42" y="115">Vm</text>
  <text class="note" x="38" y="215">-Vm</text>
  <text class="note" x="55" y="173">0</text>

  <!-- Input sine v_s (dashed) -->
  <path class="vsine" d="M60,160 C118,60 178,60 230,160 C282,260 342,260 390,160 C442,60 502,60 540,160 C592,260 652,260 680,160"/>

  <!-- alpha = 120deg marker at x = 60 + 310*(120/180) = 60 + 206.7 = ~267 -->
  <line class="vert" x1="267" y1="60" x2="267" y2="260"/>

  <!-- pi marker at x = 60 + 310 = 370 -->
  <line class="grid" x1="370" y1="60" x2="370" y2="260" stroke-dasharray="3 3"/>

  <!-- pi+alpha marker at x = 370 + 206.7 = ~577 -->
  <line class="vert2" x1="577" y1="60" x2="577" y2="260"/>

  <!-- 2pi marker at x = 680 -->
  <line class="grid" x1="680" y1="60" x2="680" y2="260" stroke-dasharray="3 3"/>

  <!-- Conduction shading: positive half alpha to pi (small region) -->
  <path class="conduct" d="M267,160 C300,140 340,120 370,160 L370,160 L267,160 Z"/>
  <!-- Conduction shading: negative half pi+alpha to 2pi (small region) -->
  <path class="conduct2" d="M577,160 C610,180 650,200 680,160 L680,160 L577,160 Z"/>

  <!-- Current waveform: only the narrow conducting portions -->
  <!-- Zero before alpha -->
  <line class="current" x1="60" y1="160" x2="267" y2="160"/>
  <!-- Positive conduction: alpha to pi (narrow) -->
  <path class="current" d="M267,160 C300,130 340,100 370,160"/>
  <!-- Zero pi to pi+alpha -->
  <line class="current" x1="370" y1="160" x2="577" y2="160"/>
  <!-- Negative conduction: pi+alpha to 2pi (narrow) -->
  <path class="current" d="M577,160 C610,190 650,220 680,160" stroke="#1565c0"/>

  <!-- Alpha arc -->
  <path class="arc" d="M80,160 A45,45 0 0 1 200,110"/>
  <text class="accent" x="130" y="120">a=120deg</text>

  <!-- Tick labels -->
  <text class="label" x="258" y="173">a</text>
  <text class="label" x="362" y="173">p</text>
  <text class="label" x="560" y="173">p+a</text>
  <text class="label" x="672" y="173">2p</text>

  <!-- Annotations -->
  <text class="accent" x="280" y="80" font-size="12px">SCR1: short pulse</text>
  <text class="blue-label" x="590" y="240" font-size="12px">SCR2: short pulse</text>

  <!-- ====== Lower plot: i_o (current) ====== -->
  <line class="axis" x1="60" y1="340" x2="680" y2="340"/>
  <line class="axis" x1="60" y1="270" x2="60" y2="410"/>

  <text class="txt" x="30" y="310">i</text>
  <text class="txt" x="665" y="360">wt</text>

  <line class="grid" x1="60" y1="290" x2="680" y2="290"/>
  <text class="note" x="42" y="295">Im</text>
  <text class="note" x="42" y="395">-Im</text>
  <line class="grid" x1="60" y1="390" x2="680" y2="390"/>

  <!-- alpha, pi, pi+alpha, 2pi markers -->
  <line class="vert" x1="267" y1="270" x2="267" y2="420"/>
  <line class="grid" x1="370" y1="270" x2="370" y2="420" stroke-dasharray="3 3"/>
  <line class="vert2" x1="577" y1="270" x2="577" y2="420"/>

  <!-- Zero before alpha -->
  <line class="current" x1="60" y1="340" x2="267" y2="340"/>
  <!-- Positive conduction: alpha to pi (narrow, smaller peak) -->
  <path class="current" d="M267,340 C300,310 340,280 370,340"/>
  <!-- Zero pi to pi+alpha -->
  <line class="current" x1="370" y1="340" x2="577" y2="340"/>
  <!-- Negative conduction: pi+alpha to 2pi (narrow) -->
  <path class="current" d="M577,340 C610,370 650,400 680,340" stroke="#1565c0"/>

  <!-- Conduction shading -->
  <path class="conduct" d="M267,340 C300,310 340,280 370,340 L370,340 L267,340 Z"/>
  <path class="conduct2" d="M577,340 C610,370 650,400 680,340 L680,340 L577,340 Z"/>

  <!-- Tick labels -->
  <text class="label" x="258" y="358">a</text>
  <text class="label" x="362" y="358">p</text>
  <text class="label" x="560" y="358">p+a</text>
  <text class="label" x="672" y="358">2p</text>

  <!-- Conduction interval labels -->
  <text class="accent" x="280" y="278" font-size="12px">conduction: a to p (60deg)</text>
  <text class="blue-label" x="575" y="408" font-size="12px">p+a to 2p (60deg)</text>

  <!-- Comparison note -->
  <text class="note" x="80" y="430">Compare with alpha&lt;90: conduction window is much narrower, output power is greatly reduced</text>
</svg>