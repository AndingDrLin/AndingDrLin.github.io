<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" role="img" aria-label="Anti-parallel SCR waveform alpha less than 90 degrees">
  <style>
    .axis{stroke:#333;stroke-width:2}
    .grid{stroke:#eee;stroke-width:1}
    .vsine{fill:none;stroke:#aaa;stroke-width:1.8;stroke-dasharray:6 4}
    .current{fill:none;stroke:#c62828;stroke-width:3.5}
    .conduct{fill:#c62828;fill-opacity:0.08;stroke:none}
    .conduct2{fill:#1565c0;fill-opacity:0.08;stroke:none}
    .vert{stroke:#c62828;stroke-width:1.5;stroke-dasharray:5 4}
    .vert2{stroke:#1565c0;stroke-width:1.5;stroke-dasharray:5 4}
    .txt{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#222}
    .label{font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#555}
    .accent{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#c62828}
    .blue-label{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#1565c0}
    .note{font-family:Arial,Helvetica,sans-serif;font-size:12px;fill:#888}
    .arc{stroke:#c62828;stroke-width:1.5;fill:none}
    .arc2{stroke:#1565c0;stroke-width:1.5;fill:none}
  </style>

  <rect width="720" height="440" fill="white"/>

  <!-- Title -->
  <text class="txt" x="360" y="28" text-anchor="middle" font-size="16px">Anti-parallel SCR Current Waveform (alpha &lt; 90deg, R Load)</text>
  <text class="note" x="360" y="46" text-anchor="middle">alpha = 45deg example: feng lian SCR dian liu bo xing</text>

  <!-- ====== Upper plot: v_s and v_o ====== -->
  <!-- Axes -->
  <line class="axis" x1="60" y1="160" x2="680" y2="160"/>
  <line class="axis" x1="60" y1="60" x2="60" y2="250"/>

  <!-- Axis labels -->
  <text class="txt" x="30" y="115">v</text>
  <text class="txt" x="665" y="180">wt</text>

  <!-- Grid lines -->
  <line class="grid" x1="60" y1="110" x2="680" y2="110"/>
  <line class="grid" x1="60" y1="210" x2="680" y2="210"/>

  <!-- Vm and -Vm labels -->
  <text class="note" x="42" y="115">Vm</text>
  <text class="note" x="38" y="215">-Vm</text>
  <text class="note" x="55" y="173">0</text>

  <!-- Input sine v_s (dashed) -->
  <!-- One full cycle: 0 to 2pi mapped to x=60..680, zero at y=160, Vm at y=70, -Vm at y=250 -->
  <!-- Using bezier: half-period = 310px -->
  <path class="vsine" d="M60,160 C118,60 178,60 230,160 C282,260 342,260 390,160 C442,60 502,60 540,160 C592,260 652,260 680,160"/>

  <!-- pi/4 = 45deg, alpha marker at x = 60 + 310*(45/180) = 60 + 77.5 = ~138 -->
  <line class="vert" x1="138" y1="60" x2="138" y2="260"/>

  <!-- pi marker at x = 60 + 310 = 370 -->
  <line class="grid" x1="370" y1="60" x2="370" y2="260" stroke-dasharray="3 3"/>

  <!-- pi+alpha marker at x = 370 + 77.5 = ~448 -->
  <line class="vert2" x1="448" y1="60" x2="448" y2="260"/>

  <!-- 2pi marker at x = 60 + 620 = 680 -->
  <line class="grid" x1="680" y1="60" x2="680" y2="260" stroke-dasharray="3 3"/>

  <!-- Conduction shading: positive half alpha to pi -->
  <path class="conduct" d="M138,160 C178,70 280,70 370,160 L370,160 L138,160 Z"/>
  <!-- Conduction shading: negative half pi+alpha to 2pi -->
  <path class="conduct2" d="M448,160 C500,250 600,250 680,160 L680,160 L448,160 Z"/>

  <!-- Current waveform (same shape as voltage for R load) -->
  <!-- Positive conduction: alpha to pi -->
  <path class="current" d="M138,160 C178,70 280,70 370,160"/>
  <!-- Negative conduction: pi+alpha to 2pi -->
  <path class="current" d="M448,160 C500,250 600,250 680,160" stroke="#1565c0"/>

  <!-- Zero segments: 0 to alpha, pi to pi+alpha, 2pi onward -->
  <line class="current" x1="60" y1="160" x2="138" y2="160"/>
  <line class="current" x1="370" y1="160" x2="448" y2="160" stroke="#1565c0"/>
  <line class="current" x1="680" y1="160" x2="700" y2="160" stroke="#aaa" stroke-dasharray="3 3"/>

  <!-- Alpha arc -->
  <path class="arc" d="M80,160 A30,30 0 0 1 120,145"/>
  <text class="accent" x="95" y="150">a</text>

  <!-- Tick labels -->
  <text class="label" x="130" y="173">a</text>
  <text class="label" x="362" y="173">p</text>
  <text class="label" x="440" y="173">p+a</text>
  <text class="label" x="672" y="173">2p</text>

  <!-- Annotations -->
  <text class="accent" x="220" y="80">SCR1 conducts</text>
  <text class="blue-label" x="530" y="240">SCR2 conducts</text>

  <!-- ====== Lower plot: i_o (current) ====== -->
  <!-- Axes -->
  <line class="axis" x1="60" y1="340" x2="680" y2="340"/>
  <line class="axis" x1="60" y1="270" x2="60" y2="410"/>

  <!-- Axis labels -->
  <text class="txt" x="30" y="310">i</text>
  <text class="txt" x="665" y="360">wt</text>

  <!-- Grid -->
  <line class="grid" x1="60" y1="290" x2="680" y2="290"/>
  <text class="note" x="42" y="295">Im</text>
  <text class="note" x="42" y="395">-Im</text>
  <line class="grid" x1="60" y1="390" x2="680" y2="390"/>

  <!-- pi/4, pi, pi+alpha, 2pi markers -->
  <line class="vert" x1="138" y1="270" x2="138" y2="420"/>
  <line class="grid" x1="370" y1="270" x2="370" y2="420" stroke-dasharray="3 3"/>
  <line class="vert2" x1="448" y1="270" x2="448" y2="420"/>

  <!-- Current waveform: positive half alpha to pi (sine shape) -->
  <!-- Zero before alpha -->
  <line class="current" x1="60" y1="340" x2="138" y2="340"/>
  <!-- Positive conduction -->
  <path class="current" d="M138,340 C178,250 280,250 370,340"/>
  <!-- Zero pi to pi+alpha -->
  <line class="current" x1="370" y1="340" x2="448" y2="340"/>
  <!-- Negative conduction -->
  <path class="current" d="M448,340 C500,430 600,430 680,340" stroke="#1565c0"/>

  <!-- Conduction shading -->
  <path class="conduct" d="M138,340 C178,250 280,250 370,340 L370,340 L138,340 Z"/>
  <path class="conduct2" d="M448,340 C500,430 600,430 680,340 L680,340 L448,340 Z"/>

  <!-- Tick labels -->
  <text class="label" x="130" y="358">a</text>
  <text class="label" x="362" y="358">p</text>
  <text class="label" x="440" y="358">p+a</text>
  <text class="label" x="672" y="358">2p</text>

  <!-- Conduction interval labels -->
  <text class="accent" x="230" y="275" font-size="12px">conduction: a to p</text>
  <text class="blue-label" x="540" y="408" font-size="12px">conduction: p+a to 2p</text>

  <!-- Phase labels for top plot -->
  <text class="label" x="55" y="58" font-size="11px">v_s, v_o</text>
  <text class="label" x="55" y="268" font-size="11px">i_o</text>
</svg>