<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-label="Boost converter circuit topology: input source, inductor, MOSFET switch, diode, output capacitor and load">
  <style>
    .w{stroke:#333;stroke-width:2.5;fill:none}
    .t{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#222}
    .b{font-weight:bold;font-size:15px;fill:#111}
    .h{font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#111;font-weight:bold}
    .s{font-size:12px;fill:#555}
    .cur{stroke:#c62828;stroke-width:2;fill:none;stroke-dasharray:7 4;marker-end:url(#aR)}
    .cl{font-family:Arial,Helvetica,sans-serif;font-size:12px;fill:#c62828;font-weight:bold}
  </style>
  <defs><marker id="aR" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><path d="M0,0 L7,2.5 L0,5" fill="none" stroke="#c62828" stroke-width="1.5"/></marker></defs>
  <rect width="720" height="400" fill="#fff"/>
  <text class="h" x="200" y="30">Boost 升压变换器 — 电路拓扑</text>

  <!-- Top rail y=110, bottom rail y=290 -->

  <!-- Vin source (left) -->
  <text class="t b" x="25" y="105">V_in</text>
  <text class="t" x="28" y="120" fill="#c62828" font-weight="bold">+</text>
  <text class="t" x="28" y="288" fill="#c62828" font-weight="bold">−</text>
  <line class="w" x1="55" y1="110" x2="90" y2="110"/>
  <line class="w" x1="55" y1="290" x2="580" y2="290"/>
  <line class="w" x1="55" y1="110" x2="55" y2="290"/>

  <!-- Inductor L (on top rail, left side — connected directly to Vin+) -->
  <line class="w" x1="90" y1="110" x2="130" y2="110"/>
  <path d="M130,110 C130,85 155,85 155,110 C155,85 180,85 180,110 C180,85 205,85 205,110" fill="none" stroke="#333" stroke-width="2.5"/>
  <text class="t b" x="155" y="78">L</text>
  <line class="w" x1="205" y1="110" x2="260" y2="110"/>

  <!-- Node A: junction where inductor meets switch and diode -->
  <circle cx="260" cy="110" r="4" fill="#333"/>
  <text class="s" x="255" y="100">A (节点)</text>

  <!-- Switch S: from node A down to ground (parallel path) -->
  <line class="w" x1="260" y1="110" x2="260" y2="155"/>
  <rect x="235" y="155" width="50" height="40" rx="4" fill="none" stroke="#333" stroke-width="2.5"/>
  <text class="t b" x="251" y="181">S</text>
  <text class="s" x="290" y="178">开关 MOSFET</text>
  <line class="w" x1="260" y1="195" x2="260" y2="290"/>

  <!-- Diode D: from node A rightward (horizontal), cathode toward output -->
  <!-- Diode: triangle pointing right, bar at right (cathode) -->
  <line class="w" x1="260" y1="110" x2="310" y2="110"/>
  <polygon points="310,98 310,122 340,110" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="340" y1="98" x2="340" y2="122" stroke="#333" stroke-width="2.5"/>
  <text class="t b" x="348" y="100">D</text>
  <text class="s" x="348" y="115">二极管</text>
  <line class="w" x1="340" y1="110" x2="400" y2="110"/>

  <!-- Output capacitor C (in parallel with load) -->
  <line x1="400" y1="95" x2="400" y2="125" stroke="#333" stroke-width="2.5"/>
  <line x1="410" y1="95" x2="410" y2="125" stroke="#333" stroke-width="2.5"/>
  <text class="t b" x="415" y="116">C</text>
  <line class="w" x1="405" y1="110" x2="460" y2="110"/>

  <!-- Load resistor R (zigzag) -->
  <path d="M460,110 L470,90 L485,130 L500,90 L515,130 L530,90 L540,110" fill="none" stroke="#333" stroke-width="2.5"/>
  <text class="t b" x="490" y="82">R (负载)</text>
  <text class="t" x="467" y="78" fill="#c62828" font-weight="bold">+</text>
  <text class="t" x="525" y="78" fill="#c62828" font-weight="bold">−</text>
  <text class="t b" x="495" y="150">V_o</text>

  <!-- Wire from load to bottom rail -->
  <line class="w" x1="540" y1="110" x2="540" y2="290"/>

  <!-- Current flow: ON period (through L and S) -->
  <path class="cur" d="M100,117 L125,117"/>
  <path class="cur" d="M210,117 L255,117"/>
  <path class="cur" d="M254,150 L254,120"/>
  <text class="cl" x="90" y="132">i_in = i_L</text>

  <!-- Current flow: OFF period (through L, D, to output) -->
  <path class="cur" d="M270,117 L305,117"/>
  <path class="cur" d="M345,117 L395,117"/>
  <text class="cl" x="345" y="95">OFF 期间</text>
  <text class="cl" x="345" y="80">i_L → D → 负载</text>

  <!-- Key difference annotation -->
  <rect x="570" y="70" width="140" height="200" rx="6" fill="#f0f7ff" stroke="#90caf9" stroke-width="1"/>
  <text class="t b" x="585" y="92">关键区别</text>
  <text class="s" x="580" y="115">电感 L 在输入侧</text>
  <text class="s" x="580" y="135">（Buck 在输出侧）</text>
  <text class="s" x="580" y="160">ON: L 从 V_in 储能</text>
  <text class="s" x="580" y="180">S 导通, D 截止</text>
  <text class="s" x="580" y="205">OFF: L 和 V_in 串联</text>
  <text class="s" x="580" y="225">向输出放电, D 导通</text>
  <text class="s" x="580" y="250">V_o = V_in/(1−D)</text>
  <text class="s" x="580" y="265">只能升压</text>
</svg>
