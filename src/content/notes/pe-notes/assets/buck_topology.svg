<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img" aria-label="Buck converter circuit topology: input source, MOSFET switch, freewheeling diode, LC filter, load resistor">
  <style>
    .w{stroke:#333;stroke-width:2.5;fill:none}
    .t{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#222}
    .b{font-weight:bold;font-size:15px;fill:#111}
    .h{font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#111;font-weight:bold}
    .s{font-size:12px;fill:#555}
    .cur{stroke:#c62828;stroke-width:2;fill:none;stroke-dasharray:7 4;marker-end:url(#aR)}
    .cl{font-family:Arial,Helvetica,sans-serif;font-size:12px;fill:#c62828;font-weight:bold}
  </style>
  <defs><marker id="aR" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><path d="M0,0 L7,2.5 L0,5" fill="none" stroke="#c62828" stroke-width="1.5"/></marker></defs>
  <rect width="720" height="380" fill="#fff"/>
  <text class="h" x="200" y="30">Buck 降压变换器 — 电路拓扑</text>

  <!-- Top rail y=100, bottom rail y=280 -->

  <!-- Vin source -->
  <text class="t b" x="25" y="95">V_in</text>
  <text class="t" x="28" y="110" fill="#c62828" font-weight="bold">+</text>
  <text class="t" x="28" y="278" fill="#c62828" font-weight="bold">−</text>
  <line class="w" x1="55" y1="100" x2="120" y2="100"/>
  <line class="w" x1="55" y1="280" x2="120" y2="280"/>
  <!-- source verticals -->
  <line class="w" x1="55" y1="100" x2="55" y2="280"/>

  <!-- Switch S (box) -->
  <rect x="120" y="80" width="60" height="40" rx="4" fill="none" stroke="#333" stroke-width="2.5"/>
  <text class="t b" x="139" y="106">S</text>
  <text class="s" x="125" y="73">开关 MOSFET</text>
  <line class="w" x1="150" y1="100" x2="150" y2="100"/>
  <!-- wire from Vin+ to switch top -->
  <line class="w" x1="150" y1="100" x2="150" y2="120"/>

  <!-- Node A: junction of switch output, diode cathode, inductor input -->
  <line class="w" x1="150" y1="120" x2="260" y2="120"/>
  <circle cx="260" cy="120" r="4" fill="#333"/>
  <text class="s" x="255" y="142">A (节点)</text>

  <!-- Freewheeling diode D: cathode at node A (top), anode to ground (bottom) -->
  <!-- Vertical, triangle pointing down (anode at bottom), bar at top (cathode) -->
  <line class="w" x1="260" y1="120" x2="260" y2="165"/>
  <!-- Diode: triangle pointing up, bar at top = cathode at top -->
  <polygon points="248,195 272,195 260,165" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="248" y1="195" x2="272" y2="195" stroke="#333" stroke-width="2.5"/>
  <!-- anode wire down to ground -->
  <line class="w" x1="260" y1="195" x2="260" y2="280"/>
  <text class="t b" x="275" y="170">D</text>
  <text class="s" x="275" y="185">续流二极管</text>
  <text class="s" x="275" y="198">freewheeling</text>

  <!-- Inductor L: from node A rightward along top rail -->
  <line class="w" x1="260" y1="120" x2="310" y2="120"/>
  <!-- Inductor symbol: 3 bumps -->
  <path d="M310,120 C310,95 335,95 335,120 C335,95 360,95 360,120 C360,95 385,95 385,120" fill="none" stroke="#333" stroke-width="2.5"/>
  <text class="t b" x="335" y="88">L</text>
  <line class="w" x1="385" y1="120" x2="440" y2="120"/>

  <!-- Output capacitor C -->
  <line x1="440" y1="105" x2="440" y2="135" stroke="#333" stroke-width="2.5"/>
  <line x1="450" y1="105" x2="450" y2="135" stroke="#333" stroke-width="2.5"/>
  <text class="t b" x="455" y="126">C</text>
  <line class="w" x1="445" y1="120" x2="500" y2="120"/>

  <!-- Load resistor R (zigzag) -->
  <path d="M500,120 L510,100 L525,140 L540,100 L555,140 L570,100 L580,120" fill="none" stroke="#333" stroke-width="2.5"/>
  <text class="t b" x="540" y="92">R (负载)</text>
  <!-- Vo labels -->
  <text class="t" x="510" y="80" fill="#c62828" font-weight="bold">+</text>
  <text class="t" x="565" y="80" fill="#c62828" font-weight="bold">−</text>
  <text class="t b" x="535" y="160">V_o</text>

  <!-- Wire from load to bottom rail -->
  <line class="w" x1="580" y1="120" x2="580" y2="280"/>

  <!-- Bottom rail -->
  <line class="w" x1="55" y1="280" x2="580" y2="280"/>

  <!-- Current flow annotation (ON period) -->
  <path class="cur" d="M100,107 L145,107"/>
  <path class="cur" d="M180,107 L255,107"/>
  <path class="cur" d="M310,127 L380,127"/>
  <path class="cur" d="M445,127 L500,127"/>
  <text class="cl" x="90" y="118">i_in</text>
  <text class="cl" x="340" y="145">i_L</text>
  <text class="cl" x="470" y="145">i_out</text>

  <!-- Current flow annotation (OFF period - through diode) -->
  <path class="cur" d="M254,260 L254,200"/>
  <text class="cl" x="215" y="240">OFF 期间</text>
  <text class="cl" x="215" y="255">续流电流</text>

  <!-- Legend box -->
  <rect x="600" y="70" width="110" height="150" rx="6" fill="#f8f8f8" stroke="#ccc" stroke-width="1"/>
  <text class="t b" x="615" y="92">图例</text>
  <line x1="610" y1="105" x2="640" y2="105" stroke="#c62828" stroke-width="2" stroke-dasharray="7 4"/>
  <text class="s" x="645" y="109">ON 电流</text>
  <rect x="610" y="120" width="30" height="20" fill="none" stroke="#333" stroke-width="2" rx="3"/>
  <text class="s" x="645" y="135">开关</text>
  <polygon points="615,155 635,155 625,140" fill="none" stroke="#333" stroke-width="1.5"/>
  <line x1="615" y1="155" x2="635" y2="155" stroke="#333" stroke-width="2"/>
  <text class="s" x="645" y="152">二极管</text>
  <path d="M610,175 C610,165 625,165 625,175 C625,165 640,165 640,175" fill="none" stroke="#333" stroke-width="1.5"/>
  <text class="s" x="645" y="180">电感 L</text>
  <line x1="615" y1="195" x2="615" y2="210" stroke="#333" stroke-width="1.5"/>
  <line x1="622" y1="195" x2="622" y2="210" stroke="#333" stroke-width="1.5"/>
  <text class="s" x="645" y="207">电容 C</text>
</svg>
