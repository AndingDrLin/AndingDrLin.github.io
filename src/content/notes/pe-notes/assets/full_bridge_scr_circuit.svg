<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" font-family="Times New Roman, serif" font-size="15">
  <style>
    text { font-family: 'Times New Roman', serif; }
    .wire { stroke: #333; stroke-width: 1.6; fill: none; }
    .thick { stroke-width: 2.2; }
    .scr-body { fill: none; stroke: #333; stroke-width: 1.6; }
    .scr-gate { fill: none; stroke: #333; stroke-width: 1.2; }
    .label-red { fill: #c0392b; font-weight: bold; }
    .label-blue { fill: #1565c0; }
    .label-green { fill: #2e7d32; }
    .label-gray { fill: #666; font-size: 13px; }
    .current-path { fill: none; stroke: #1565c0; stroke-width: 2.8; stroke-dasharray: 8 4; }
    .current-path2 { fill: none; stroke: #2e7d32; stroke-width: 2.8; stroke-dasharray: 8 4; }
    .fwd { fill: none; stroke: #2e7d32; stroke-width: 1.6; }
    .fwd-fill { fill: #2e7d32; fill-opacity: 0.1; stroke: #2e7d32; stroke-width: 1.6; }
  </style>
  <defs>
    <marker id="arrB" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0.5 L8,3.5 L0,6.5" fill="none" stroke="#1565c0" stroke-width="1.2"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0.5 L8,3.5 L0,6.5" fill="none" stroke="#2e7d32" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="390" y="32" text-anchor="middle" font-size="18" font-weight="bold">全控桥式 SCR 电路 (Fully Controlled Bridge)</text>
  <text x="390" y="54" text-anchor="middle" font-size="13" fill="#666">4 SCR + 续流二极管 (FWD)，直流电机负载</text>

  <!-- ==================== AC SOURCE ==================== -->
  <circle cx="65" cy="260" r="26" class="wire"/>
  <path d="M49,260 Q54,247 59,260 Q64,273 69,260 Q74,247 79,260 Q84,273 89,260" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="65" y="300" text-anchor="middle" font-size="14" class="label-gray" font-size="14px">v_s = V_m sin θ</text>

  <!-- Source to top rail -->
  <line x1="65" y1="234" x2="65" y2="100" class="wire"/>
  <line x1="65" y1="100" x2="190" y2="100" class="wire"/>
  <text x="48" y="105" font-size="13" fill="#888">+</text>

  <!-- Source to bottom rail -->
  <line x1="65" y1="286" x2="65" y2="430" class="wire"/>
  <line x1="65" y1="430" x2="190" y2="430" class="wire"/>
  <text x="48" y="435" font-size="13" fill="#888">-</text>

  <!-- Top rail continues across -->
  <line x1="190" y1="100" x2="230" y2="100" class="wire"/>
  <line x1="540" y1="100" x2="600" y2="100" class="wire"/>

  <!-- Bottom rail continues across -->
  <line x1="190" y1="430" x2="230" y2="430" class="wire"/>
  <line x1="540" y1="430" x2="600" y2="430" class="wire"/>

  <!-- ==================== SCR1 (upper-left): anode=top, cathode=A ==================== -->
  <line x1="230" y1="100" x2="230" y2="135" class="wire"/>
  <!-- Anode bars -->
  <line x1="212" y1="135" x2="248" y2="135" class="scr-body"/>
  <!-- Triangle body -->
  <polygon points="212,135 248,135 230,170" class="scr-body"/>
  <!-- Cathode bar -->
  <line x1="212" y1="170" x2="248" y2="170" class="wire thick"/>
  <!-- Cathode wire to node A -->
  <line x1="230" y1="170" x2="230" y2="265" class="wire"/>
  <!-- Gate -->
  <line x1="212" y1="152" x2="180" y2="152" class="scr-gate"/>
  <text x="175" y="156" text-anchor="end" font-size="14">G</text>
  <!-- Label -->
  <text x="256" y="148" class="label-red" font-size="14px">SCR₁</text>
  <text x="256" y="163" class="label-gray">正半周</text>

  <!-- ==================== SCR2 (lower-left): anode=bottom, cathode=A ==================== -->
  <line x1="230" y1="430" x2="230" y2="395" class="wire"/>
  <!-- Anode bars -->
  <line x1="212" y1="395" x2="248" y2="395" class="scr-body"/>
  <!-- Triangle body (pointing up, anode at bottom) -->
  <polygon points="212,395 248,395 230,360" class="scr-body"/>
  <!-- Cathode bar (top) -->
  <line x1="212" y1="360" x2="248" y2="360" class="wire thick"/>
  <!-- Cathode wire to node A -->
  <line x1="230" y1="360" x2="230" y2="265" class="wire"/>
  <!-- Gate -->
  <line x1="212" y1="378" x2="180" y2="378" class="scr-gate"/>
  <text x="175" y="382" text-anchor="end" font-size="14">G</text>
  <!-- Label -->
  <text x="256" y="375" class="label-red" font-size="14px">SCR₂</text>
  <text x="256" y="390" class="label-gray">负半周</text>

  <!-- ==================== Node A ==================== -->
  <circle cx="230" cy="265" r="3.5" fill="#333"/>
  <text x="235" y="260" font-size="16" font-weight="bold" fill="#333">A</text>

  <!-- ==================== SCR4 (upper-right): anode=B, cathode=top ==================== -->
  <!-- In this layout: anode at B, cathode at top rail -->
  <line x1="540" y1="100" x2="540" y2="135" class="wire"/>
  <!-- Cathode bars (at top, connected to top rail) -->
  <line x1="522" y1="135" x2="558" y2="135" class="wire thick"/>
  <!-- Triangle body (pointing down, cathode at top = bars at top) -->
  <polygon points="522,135 558,135 540,170" class="scr-body"/>
  <!-- Anode bar (bottom) -->
  <line x1="522" y1="170" x2="558" y2="170" class="scr-body"/>
  <!-- Anode wire to node B -->
  <line x1="540" y1="170" x2="540" y2="265" class="wire"/>
  <!-- Gate -->
  <line x1="558" y1="152" x2="590" y2="152" class="scr-gate"/>
  <text x="595" y="156" font-size="14">G</text>
  <!-- Label -->
  <text x="460" y="148" class="label-red" font-size="14px">SCR₄</text>
  <text x="460" y="163" class="label-gray">负半周</text>

  <!-- ==================== SCR3 (lower-right): anode=B, cathode=bottom ==================== -->
  <line x1="540" y1="430" x2="540" y2="395" class="wire"/>
  <!-- Cathode bars (at bottom) -->
  <line x1="522" y1="395" x2="558" y2="395" class="wire thick"/>
  <!-- Triangle body (pointing up from bottom) -->
  <polygon points="522,395 558,395 540,360" class="scr-body"/>
  <!-- Anode bar (top, at B) -->
  <line x1="522" y1="360" x2="558" y2="360" class="scr-body"/>
  <!-- Anode wire to node B -->
  <line x1="540" y1="360" x2="540" y2="265" class="wire"/>
  <!-- Gate -->
  <line x1="558" y1="378" x2="590" y2="378" class="scr-gate"/>
  <text x="595" y="382" font-size="14">G</text>
  <!-- Label -->
  <text x="460" y="375" class="label-red" font-size="14px">SCR₃</text>
  <text x="460" y="390" class="label-gray">正半周</text>

  <!-- ==================== Node B ==================== -->
  <circle cx="540" cy="265" r="3.5" fill="#333"/>
  <text x="545" y="260" font-size="16" font-weight="bold" fill="#333">B</text>

  <!-- ==================== DC Motor Load ==================== -->
  <line x1="230" y1="265" x2="295" y2="265" class="wire"/>
  <rect x="295" y="240" width="175" height="55" rx="8" fill="#f0f7ff" stroke="#333" stroke-width="1.6"/>
  <!-- Motor symbol: circle with M -->
  <circle cx="382" cy="268" r="18" fill="none" stroke="#333" stroke-width="1.2"/>
  <text x="382" y="273" text-anchor="middle" font-size="15" font-weight="bold">M</text>
  <text x="382" y="253" text-anchor="middle" font-size="12" fill="#555">DC 电机</text>
  <line x1="470" y1="265" x2="540" y2="265" class="wire"/>

  <!-- ==================== Freewheeling Diode (FWD) ==================== -->
  <!-- FWD across load: cathode at A (left), anode at B (right) -->
  <!-- Drawn above the load for clarity -->
  <line x1="230" y1="265" x2="230" y2="215" class="fwd"/>
  <line x1="230" y1="215" x2="365" y2="215" class="fwd"/>
  <line x1="540" y1="265" x2="540" y2="215" class="fwd"/>
  <line x1="395" y1="215" x2="540" y2="215" class="fwd"/>
  <!-- Diode triangle pointing left (anode at right/B, cathode at left/A) -->
  <polygon points="395,205 395,225 370,215" class="fwd-fill"/>
  <!-- Cathode bar at left -->
  <line x1="395" y1="205" x2="395" y2="225" class="fwd" stroke-width="2"/>
  <!-- FWD label -->
  <text x="382" y="205" text-anchor="middle" font-size="14" class="label-green" font-weight="bold">续流二极管 (FWD)</text>

  <!-- ==================== Current Path 1: Positive Half Cycle (blue dash) ==================== -->
  <!-- Path: top(+) -> SCR1 -> A -> load -> B -> SCR3 -> bottom(-) -->
  <!-- Through SCR1: top rail to A -->
  <path d="M 250,100 C 260,100 260,140 248,170" class="current-path" marker-end="url(#arrB)"/>
  <!-- Through load: A to B -->
  <path d="M 250,258 L 300,258 L 300,265 L 470,265 L 520,265" class="current-path" marker-end="url(#arrB)"/>
  <!-- Through SCR3: B to bottom rail -->
  <path d="M 520,270 C 510,300 510,370 520,395" class="current-path" marker-end="url(#arrB)"/>

  <!-- Current Path 1 label -->
  <text x="640" y="130" font-size="13" class="label-blue" font-weight="bold">正半周电流路径</text>
  <text x="640" y="148" font-size="12" class="label-blue">(+): 电源 → SCR₁ → A →</text>
  <text x="640" y="164" font-size="12" class="label-blue">负载 → B → SCR₃ → 电源(-)</text>

  <!-- ==================== Current Path 2: Negative Half Cycle (green dash) ==================== -->
  <!-- Path: bottom(+) -> SCR2 -> A -> load -> B -> SCR4 -> top(-) -->
  <!-- Through SCR2: bottom rail to A -->
  <path d="M 250,430 C 260,430 260,400 248,360" class="current-path2" marker-end="url(#arrG)"/>
  <!-- Through load: A to B (same direction) -->
  <path d="M 250,272 L 300,272 L 300,265 L 470,265 L 520,265" class="current-path2" marker-end="url(#arrG)"/>
  <!-- Through SCR4: B to top rail -->
  <path d="M 520,260 C 510,230 510,170 520,135" class="current-path2" marker-end="url(#arrG)"/>

  <!-- Current Path 2 label -->
  <text x="640" y="380" font-size="13" class="label-green" font-weight="bold">负半周电流路径</text>
  <text x="640" y="398" font-size="12" class="label-green">(-): 电源(-) → SCR₂ → A →</text>
  <text x="640" y="414" font-size="12" class="label-green">负载 → B → SCR₄ → 电源(+)</text>

  <!-- ==================== FWD current path (dashed, during freewheeling) ==================== -->
  <path d="M 365,225 C 365,250 365,260 382,285 C 395,260 395,250 395,225" fill="none" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="382" y="230" text-anchor="middle" font-size="11" class="label-green">续流回路</text>

  <!-- ==================== Notes box ==================== -->
  <rect x="620" y="180" width="145" height="175" rx="6" fill="none" stroke="#ccc" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="692" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">触发规则</text>
  <text x="630" y="220" font-size="12" fill="#555">正半周 (v_s &gt; 0):</text>
  <text x="635" y="236" font-size="12" class="label-red">SCR₁ + SCR₃ 触发</text>
  <text x="630" y="260" font-size="12" fill="#555">负半周 (v_s &lt; 0):</text>
  <text x="635" y="276" font-size="12" class="label-red">SCR₂ + SCR₄ 触发</text>
  <text x="630" y="300" font-size="12" fill="#555">触发角: α</text>
  <text x="630" y="325" font-size="12" fill="#555">FWD: 续流期间</text>
  <text x="635" y="341" font-size="12" class="label-green">v_o = 0</text>

</svg>