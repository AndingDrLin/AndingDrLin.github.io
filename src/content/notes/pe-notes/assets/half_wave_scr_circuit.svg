<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 580" font-family="Times New Roman, serif" font-size="14">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowblue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1976d2"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="18" font-weight="bold">半波 SCR 电路 (Half-Wave SCR)</text>
  <text x="360" y="50" text-anchor="middle" font-size="14" fill="#555">电阻负载 (Resistive Load)</text>

  <!-- AC Source -->
  <circle cx="80" cy="280" r="28" fill="none" stroke="#333" stroke-width="2"/>
  <path d="M60,280 Q70,260 80,280 Q90,300 100,280" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="80" y="325" text-anchor="middle" font-size="13">$v_s = \hat{V}_m \sin\theta$</text>

  <!-- Wire from source to SCR anode -->
  <line x1="108" y1="280" x2="240" y2="280" stroke="#333" stroke-width="2"/>
  <!-- Polarity label at source -->
  <text x="115" y="270" font-size="12" fill="#c0392b">+</text>

  <!-- SCR Symbol (vertical) -->
  <!-- Anode bar (top) -->
  <line x1="240" y1="280" x2="240" y2="240" stroke="#333" stroke-width="2"/>
  <line x1="220" y1="240" x2="260" y2="240" stroke="#333" stroke-width="2.5"/>
  <!-- Triangle body -->
  <polygon points="225,240 255,240 240,200" fill="none" stroke="#333" stroke-width="2"/>
  <!-- Cathode bar (bottom) -->
  <line x1="220" y1="200" x2="260" y2="200" stroke="#333" stroke-width="2.5"/>
  <!-- Gate terminal -->
  <line x1="260" y1="225" x2="300" y2="225" stroke="#333" stroke-width="2"/>
  <circle cx="300" cy="225" r="3" fill="#333"/>
  <!-- Gate label -->
  <text x="308" y="230" font-size="14" font-weight="bold">Gate</text>
  <text x="308" y="245" font-size="12" fill="#555">(门极)</text>

  <!-- SCR label -->
  <text x="270" y="250" font-size="16" font-weight="bold" fill="#c0392b">SCR</text>

  <!-- Wire from SCR cathode to load -->
  <line x1="240" y1="200" x2="240" y2="160" stroke="#333" stroke-width="2"/>
  <line x1="240" y1="160" x2="360" y2="160" stroke="#333" stroke-width="2"/>
  <!-- Node label -->
  <text x="285" y="152" font-size="13" font-weight="bold">+</text>

  <!-- Load Resistor -->
  <rect x="360" y="140" width="120" height="40" rx="4" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="420" y="165" text-anchor="middle" font-size="15" font-weight="bold">$R$</text>
  <text x="420" y="130" text-anchor="middle" font-size="12" fill="#555">电阻负载</text>

  <!-- Wire from load to source return -->
  <line x1="480" y1="160" x2="560" y2="160" stroke="#333" stroke-width="2"/>
  <line x1="560" y1="160" x2="560" y2="280" stroke="#333" stroke-width="2"/>
  <line x1="560" y1="280" x2="108" y2="280" stroke="#333" stroke-width="2"/>
  <!-- Polarity label -->
  <text x="548" y="270" font-size="12" fill="#1976d2">-</text>

  <!-- Voltage labels -->
  <!-- Vo across load -->
  <line x1="340" y1="140" x2="340" y2="120" stroke="#e65100" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="500" y1="140" x2="500" y2="120" stroke="#e65100" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="340" y1="120" x2="500" y2="120" stroke="#e65100" stroke-width="1.5"/>
  <text x="420" y="115" text-anchor="middle" font-size="14" fill="#e65100" font-weight="bold">$v_o$</text>

  <!-- Current direction arrow -->
  <line x1="300" y1="160" x2="340" y2="160" stroke="#1976d2" stroke-width="1.5" marker-end="url(#arrowblue)"/>
  <text x="310" y="180" font-size="13" fill="#1976d2">$i_o$</text>

  <!-- Firing angle annotation -->
  <text x="80" y="370" text-anchor="middle" font-size="14" fill="#333">
    <tspan>触发角 (Firing Angle):</tspan>
  </text>
  <text x="80" y="395" text-anchor="middle" font-size="16" font-weight="bold" fill="#c0392b">$\alpha$</text>

  <!-- Conducting interval -->
  <rect x="100" y="430" width="520" height="120" rx="6" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="360" y="455" text-anchor="middle" font-size="15" font-weight="bold">导通区间 (Conducting Interval)</text>

  <!-- Sine wave reference in box -->
  <path d="M140,510 Q180,470 220,510 Q260,550 300,510 Q340,470 380,510 Q420,550 460,510 Q500,470 540,510 Q580,550 600,510" fill="none" stroke="#ccc" stroke-width="1" stroke-dasharray="4,2"/>

  <!-- Alpha to pi region -->
  <line x1="260" y1="460" x2="260" y2="540" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="260" y="558" text-anchor="middle" font-size="13" fill="#c0392b">$\alpha$</text>

  <line x1="400" y1="460" x2="400" y2="540" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="400" y="558" text-anchor="middle" font-size="13" fill="#c0392b">$\pi$</text>

  <!-- Shaded conducting region -->
  <rect x="260" y="462" width="140" height="38" fill="#1976d2" fill-opacity="0.15"/>
  <text x="330" y="485" text-anchor="middle" font-size="13" fill="#1976d2" font-weight="bold">SCR 导通</text>

  <!-- Labels -->
  <text x="140" y="500" font-size="12" fill="#888">OFF</text>
  <text x="460" y="500" font-size="12" fill="#888">OFF</text>

  <!-- Formula box -->
  <rect x="380" y="350" width="320" height="90" rx="6" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5"/>
  <text x="395" y="375" font-size="14" font-weight="bold">半波 SCR 平均值：</text>
  <text x="395" y="400" font-size="16">$V_{avg} = \dfrac{\hat{V}_m}{2\pi}(1 + \cos\alpha)$</text>
  <text x="395" y="425" font-size="12" fill="#666">导通区间: $\alpha \leq \theta \leq \pi$</text>
</svg>