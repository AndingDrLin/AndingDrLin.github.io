<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-label="Half-wave SCR with inductive load and freewheeling diode waveform">
  <style>
    .axis{stroke:#222;stroke-width:2}
    .vs{fill:none;stroke:#aaa;stroke-width:2}
    .vo{fill:none;stroke:#1565c0;stroke-width:3.5}
    .io{fill:none;stroke:#2e7d32;stroke-width:3.5}
    .dash{stroke:#c62828;stroke-width:2;stroke-dasharray:6 5}
    .dash2{stroke:#7b1fa2;stroke-width:2;stroke-dasharray:6 5}
    .fwd{fill:#e8f5e9;stroke:#2e7d32;stroke-width:1.5;opacity:0.5}
    .txt{font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:#222}
    .small{font-size:13px}
    .lbl{font-size:14px}
  </style>
  <rect width="720" height="480" fill="white"/>

  <!-- ======= TOP PANEL: Voltage ======= -->
  <text class="txt" x="18" y="50" font-weight="bold">v_o</text>

  <!-- axes -->
  <line class="axis" x1="70" y1="130" x2="665" y2="130"/>
  <line class="axis" x1="70" y1="40" x2="70" y2="215"/>

  <!-- Input sinusoid v_s (light grey, reference) -->
  <path class="vs" d="M70,130 C95,55 120,55 145,80 Q170,115 195,130 C220,155 245,205 270,205 Q295,205 320,130 C345,55 370,55 395,80 Q420,115 445,130 C470,155 495,205 520,205 Q545,205 570,130 C595,55 620,55 645,80 Q658,105 665,130"/>

  <!-- Output voltage v_o (blue, thick) -->
  <!-- alpha ~ 110 degrees: theta_alpha at about x=145 -->
  <!-- Conduction: alpha to pi  (x=145 to x=270 roughly) -->
  <!-- Freewheeling: pi to pi+alpha (x=270 to ~395): v_o = 0 -->
  <!-- Then zero until next alpha: 395 to ~445 -->
  <path class="vo" d="M70,130 L145,130 C145,130 158,125 170,115 Q195,80 220,80 Q245,80 262,115 L270,130 L395,130"/>
  <!-- Negative half: SCR off, freewheeling continues, no output -->
  <path class="vo" d="M395,130 L665,130" stroke-dasharray="0"/>

  <!-- alpha dashed line -->
  <line class="dash" x1="145" y1="35" x2="145" y2="215"/>
  <!-- pi dashed line -->
  <line class="dash" x1="270" y1="35" x2="270" y2="215"/>
  <!-- pi+alpha dashed line -->
  <line class="dash2" x1="395" y1="35" x2="395" y2="215"/>

  <!-- Labels -->
  <text class="lbl" x="130" y="28" fill="#c62828">alpha</text>
  <text class="lbl" x="257" y="28" fill="#c62828">pi</text>
  <text class="lbl" x="378" y="28" fill="#7b1fa2">pi+alpha</text>

  <!-- Conduction region shading -->
  <rect x="145" y="35" width="125" height="180" fill="#bbdefb" opacity="0.25"/>
  <text class="small" x="175" y="58" fill="#1565c0">SCR on</text>
  <text class="small" x="160" y="74" fill="#1565c0">v_o = V_m sin(theta)</text>

  <!-- Freewheeling region shading -->
  <rect x="270" y="35" width="125" height="180" fill="#e8f5e9" opacity="0.3"/>
  <text class="small" x="285" y="58" fill="#2e7d32">freewheeling</text>
  <text class="small" x="293" y="74" fill="#2e7d32">v_o = 0 (FWD)</text>

  <!-- Off region -->
  <text class="small" x="420" y="108" fill="#888">SCR off, no output</text>

  <!-- Axis labels -->
  <text class="txt" x="600" y="155">theta</text>
  <text class="small" x="70" y="148">0</text>
  <text class="small" x="655" y="148">2pi</text>

  <!-- V_m arrow -->
  <line x1="92" y1="75" x2="92" y2="130" stroke="#888" stroke-width="1" marker-end="url(#arrowG)"/>
  <text class="small" x="42" y="108" fill="#888">V_m</text>

  <!-- ======= BOTTOM PANEL: Current ======= -->
  <text class="txt" x="18" y="280" font-weight="bold">i_o</text>

  <!-- axes -->
  <line class="axis" x1="70" y1="380" x2="665" y2="380"/>
  <line class="axis" x1="70" y1="250" x2="70" y2="460"/>

  <!-- Current waveform: starts at alpha, peaks before pi, decays through pi to pi+alpha -->
  <!-- Inductive load: current lags voltage, continues past pi due to inductance -->
  <path class="io" d="M70,380 L145,380 C155,378 165,370 175,355 Q195,310 220,295 Q245,285 262,310 C275,335 285,355 300,365 C320,373 345,377 370,379 L395,380"/>

  <!-- Second half: SCR off, current through FWD decays further (smaller peak if any) -->
  <path class="io" d="M395,380 C405,378 415,370 425,355 Q445,315 470,300 Q495,290 512,315 C525,340 535,360 550,370 C570,377 595,379 620,380 L665,380" opacity="0.4" stroke-dasharray="4 4"/>

  <!-- alpha dashed line (current panel) -->
  <line class="dash" x1="145" y1="245" x2="145" y2="460"/>
  <!-- pi dashed line -->
  <line class="dash" x1="270" y1="245" x2="270" y2="460"/>
  <!-- pi+alpha dashed line -->
  <line class="dash2" x1="395" y1="245" x2="395" y2="460"/>

  <!-- Labels -->
  <text class="lbl" x="130" y="270" fill="#c62828">alpha</text>
  <text class="lbl" x="257" y="270" fill="#c62828">pi</text>
  <text class="lbl" x="378" y="270" fill="#7b1fa2">pi+alpha</text>

  <!-- SCR on region for current -->
  <rect x="145" y="250" width="125" height="210" fill="#bbdefb" opacity="0.15"/>

  <!-- Annotation: current continues past pi -->
  <line x1="285" y1="340" x2="310" y2="300" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <text class="small" x="312" y="298" fill="#2e7d32">current continues</text>
  <text class="small" x="312" y="314" fill="#2e7d32">(inductance)</text>

  <!-- Axis labels -->
  <text class="txt" x="600" y="405">theta</text>
  <text class="small" x="70" y="398">0</text>
  <text class="small" x="655" y="398">2pi</text>

  <!-- ======= BOTTOM ANNOTATION ======= -->
  <text class="txt" x="70" y="470" fill="#1565c0">SCR conducts [alpha, pi] </text>
  <text class="txt" x="260" y="470" fill="#2e7d32">|  FWD conducts [pi, pi+alpha], v_o clamped to 0</text>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowG" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2e7d32"/>
    </marker>
  </defs>
</svg>
