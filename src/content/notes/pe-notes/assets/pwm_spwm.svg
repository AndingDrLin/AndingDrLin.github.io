<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img" aria-label="PWM and SPWM comparator principle">
  <style>.axis{stroke:#222;stroke-width:2}.tri{fill:none;stroke:#1565c0;stroke-width:2.5}.ref{fill:none;stroke:#c62828;stroke-width:3}.pulse{fill:none;stroke:#2e7d32;stroke-width:3}.dash{stroke:#aaa;stroke-width:1;stroke-dasharray:4 4}.txt{font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:#222}.small{font-size:13px}</style>
  <rect width="720" height="380" fill="white"/>
  <text class="txt" x="250" y="28">SPWM: compare sinusoidal reference with triangular carrier</text>
  <line class="axis" x1="70" y1="170" x2="665" y2="170"/><line class="axis" x1="70" y1="55" x2="70" y2="185"/>
  <path class="tri" d="M70,150 L100,70 L130,150 L160,70 L190,150 L220,70 L250,150 L280,70 L310,150 L340,70 L370,150 L400,70 L430,150 L460,70 L490,150 L520,70 L550,150 L580,70 L610,150 L640,70 L665,137"/>
  <path class="ref" d="M70,120 C145,55 220,55 295,120 C370,185 445,185 520,120 C575,75 625,80 665,110"/>
  <text class="small txt" x="520" y="70" fill="#1565c0">v_tri carrier</text><text class="small txt" x="520" y="115" fill="#c62828">v_control sine</text>
  <line class="axis" x1="70" y1="320" x2="665" y2="320"/><line class="axis" x1="70" y1="220" x2="70" y2="335"/>
  <path class="pulse" d="M70,320 V240 H100 V320 H130 V240 H160 V320 H190 V240 H220 V320 H250 V240 H280 V320 H310 V240 H340 V320 H370 V240 H400 V320 H430 V240 H460 V320 H490 V240 H520 V320 H550 V240 H580 V320 H610 V240 H640 V320 H665"/>
  <text class="small txt" x="90" y="352">switching pulses: width follows reference amplitude</text>
  <text class="small txt" x="420" y="245" fill="#2e7d32">upper switch command</text>
  <text class="small txt" x="90" y="205">Rule: v_control &gt; v_tri gives ON interval (depending on defined logic)</text>
</svg>
