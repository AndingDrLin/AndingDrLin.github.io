<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-label="Rectifier capacitor ripple waveform">
  <style>.axis{stroke:#222;stroke-width:2}.wave{fill:none;stroke:#1565c0;stroke-width:3}.cap{fill:none;stroke:#c62828;stroke-width:3}.dash{stroke:#777;stroke-width:2;stroke-dasharray:6 5}.txt{font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#222}.small{font-size:14px}</style>
  <rect width="720" height="360" fill="white"/>
  <line class="axis" x1="70" y1="290" x2="665" y2="290"/>
  <line class="axis" x1="70" y1="55" x2="70" y2="305"/>
  <path class="wave" d="M70,290 C105,90 145,90 180,290 C215,90 255,90 290,290 C325,90 365,90 400,290 C435,90 475,90 510,290 C545,90 585,90 620,290"/>
  <path class="cap" d="M105,105 C135,100 158,125 180,150 C205,95 238,105 260,145 C287,95 318,105 342,145 C368,95 400,105 423,145 C450,95 482,105 505,145 C532,95 565,105 590,145"/>
  <line class="dash" x1="95" y1="105" x2="610" y2="105"/>
  <line class="dash" x1="95" y1="150" x2="610" y2="150"/>
  <line class="dash" x1="620" y1="105" x2="620" y2="150"/>
  <path d="M615 112 L620 105 L625 112 M615 143 L620 150 L625 143" stroke="#777" fill="none" stroke-width="2"/>
  <text class="txt" x="600" y="315">t</text>
  <text class="txt" x="25" y="70">v_o</text>
  <text class="txt small" x="415" y="85" fill="#1565c0">full-wave rectified input</text>
  <text class="txt small" x="415" y="132" fill="#c62828">capacitor output</text>
  <text class="txt small" x="630" y="132">Delta V</text>
  <text class="txt small" x="100" y="330">Ripple estimate: Delta V ≈ I_load / (f_ripple C)</text>
</svg>
