<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" role="img" aria-label="Thermal resistance chain">
  <style>.box{fill:#f7f9fc;stroke:#222;stroke-width:2}.res{fill:none;stroke:#c62828;stroke-width:3}.arr{stroke:#1565c0;stroke-width:3;marker-end:url(#arrow)}.txt{font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#222}.small{font-size:14px}</style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565c0"/></marker></defs>
  <rect width="720" height="260" fill="white"/>
  <rect class="box" x="45" y="85" width="110" height="60" rx="8"/><text class="txt" x="75" y="120">Junction</text><text class="small txt" x="88" y="142">Tj</text>
  <path class="res" d="M160,115 h20 l10,-20 l20,40 l20,-40 l20,40 l20,-40 l10,20 h20"/><text class="small txt" x="195" y="78">R_theta JC</text>
  <rect class="box" x="305" y="85" width="90" height="60" rx="8"/><text class="txt" x="325" y="120">Case</text><text class="small txt" x="340" y="142">Tc</text>
  <path class="res" d="M400,115 h20 l10,-20 l20,40 l20,-40 l20,40 l10,-20 h20"/><text class="small txt" x="430" y="78">R_theta CS</text>
  <rect class="box" x="525" y="85" width="115" height="60" rx="8"/><text class="txt" x="548" y="120">Heatsink</text><text class="small txt" x="575" y="142">Ts</text>
  <path class="res" d="M640,115 h15 l10,-20 l20,40 l20,-40"/><text class="small txt" x="590" y="185">R_theta SA to ambient Ta</text>
  <line class="arr" x1="55" y1="205" x2="650" y2="205"/><text class="txt" x="275" y="235">Heat flow caused by power loss P</text>
  <text class="txt" x="95" y="35">Tj = Ta + P(R_theta JC + R_theta CS + R_theta SA)</text>
</svg>
