<svg xmlns="http://www.w3.org/2000/svg" width="780" height="520" viewBox="0 0 780 520" role="img" aria-label="Three-phase six-step line voltage waveforms vAB, vBC, vCA">
  <style>
    .axis{stroke:#444;stroke-width:1.5}
    .grid{stroke:#e0e0e0;stroke-width:1;stroke-dasharray:3 3}
    .wave-ab{fill:none;stroke:#1565c0;stroke-width:2.5}
    .wave-bc{fill:none;stroke:#c62828;stroke-width:2.5}
    .wave-ca{fill:none;stroke:#2e7d32;stroke-width:2.5}
    .marker{stroke:#aaa;stroke-width:1;stroke-dasharray:4 3}
    .txt{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#222}
    .small{font-family:Arial,Helvetica,sans-serif;font-size:12px;fill:#666}
    .legend{font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:bold}
    .state-label{font-family:Arial,Helvetica,sans-serif;font-size:12px;fill:#555}
    .title-txt{font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:#222;font-weight:bold}
  </style>
  <rect width="780" height="520" fill="white"/>
  <text class="title-txt" x="200" y="28">Three-phase square-wave inverter line voltages (6-step waveform)</text>

  <!-- Legend -->
  <line x1="40" y1="50" x2="70" y2="50" class="wave-ab"/><text class="legend" x="75" y="54" fill="#1565c0">v_AB</text>
  <line x1="160" y1="50" x2="190" y2="50" class="wave-bc"/><text class="legend" x="195" y="54" fill="#c62828">v_BC</text>
  <line x1="280" y1="50" x2="310" y2="50" class="wave-ca"/><text class="legend" x="315" y="54" fill="#2e7d32">v_CA</text>
  <text class="small" x="420" y="54">Vd = 200 V (example); each state lasts 60°</text>

  <!-- ========== vAB waveform ========== -->
  <g transform="translate(0, 70)">
    <text class="txt" x="15" y="90" fill="#1565c0" font-weight="bold">v_AB</text>
    <!-- axes -->
    <line class="axis" x1="50" y1="40" x2="50" y2="140"/>
    <line class="axis" x1="50" y1="90" x2="750" y2="90"/>
    <!-- voltage labels -->
    <text class="small" x="20" y="45">+Vd</text>
    <text class="small" x="25" y="94">0</text>
    <text class="small" x="15" y="144">-Vd</text>

    <!-- grid lines at 60-degree boundaries -->
    <line class="grid" x1="167" y1="35" x2="167" y2="145"/>
    <line class="grid" x1="284" y1="35" x2="284" y2="145"/>
    <line class="grid" x1="401" y1="35" x2="401" y2="145"/>
    <line class="grid" x1="518" y1="35" x2="518" y2="145"/>
    <line class="grid" x1="635" y1="35" x2="635" y2="145"/>

    <!-- state labels -->
    <text class="state-label" x="90" y="25">S1</text>
    <text class="state-label" x="207" y="25">S2</text>
    <text class="state-label" x="324" y="25">S3</text>
    <text class="state-label" x="441" y="25">S4</text>
    <text class="state-label" x="558" y="25">S5</text>
    <text class="state-label" x="667" y="25">S6</text>

    <!-- vAB: +Vd(0-60), 0(60-120), -Vd(120-180), -Vd(180-240), 0(240-300), +Vd(300-360) -->
    <path class="wave-ab" d="M50,40 L167,40 L167,90 L284,90 L284,140 L401,140 L401,140 L518,140 L518,90 L635,90 L635,40 L750,40"/>
  </g>

  <!-- ========== vBC waveform ========== -->
  <g transform="translate(0, 230)">
    <text class="txt" x="15" y="90" fill="#c62828" font-weight="bold">v_BC</text>
    <!-- axes -->
    <line class="axis" x1="50" y1="40" x2="50" y2="140"/>
    <line class="axis" x1="50" y1="90" x2="750" y2="90"/>
    <!-- voltage labels -->
    <text class="small" x="20" y="45">+Vd</text>
    <text class="small" x="25" y="94">0</text>
    <text class="small" x="15" y="144">-Vd</text>

    <!-- grid lines -->
    <line class="grid" x1="167" y1="35" x2="167" y2="145"/>
    <line class="grid" x1="284" y1="35" x2="284" y2="145"/>
    <line class="grid" x1="401" y1="35" x2="401" y2="145"/>
    <line class="grid" x1="518" y1="35" x2="518" y2="145"/>
    <line class="grid" x1="635" y1="35" x2="635" y2="145"/>

    <!-- angle labels -->
    <text class="small" x="80" y="160">0°</text>
    <text class="small" x="197" y="160">60°</text>
    <text class="small" x="314" y="160">120°</text>
    <text class="small" x="431" y="160">180°</text>
    <text class="small" x="548" y="160">240°</text>
    <text class="small" x="658" y="160">300°</text>

    <!-- vBC: 0(0-60), +Vd(60-120), +Vd(120-180), 0(180-240), -Vd(240-300), -Vd(300-360) -->
    <path class="wave-bc" d="M50,90 L167,90 L167,40 L284,40 L284,40 L401,40 L401,90 L518,90 L518,140 L635,140 L635,140 L750,140"/>
  </g>

  <!-- ========== vCA waveform ========== -->
  <g transform="translate(0, 390)">
    <text class="txt" x="15" y="30" fill="#2e7d32" font-weight="bold">v_CA</text>
    <!-- axes -->
    <line class="axis" x1="50" y1="-20" x2="50" y2="80"/>
    <line class="axis" x1="50" y1="30" x2="750" y2="30"/>
    <!-- voltage labels -->
    <text class="small" x="20" y="-15">+Vd</text>
    <text class="small" x="25" y="34">0</text>
    <text class="small" x="15" y="84">-Vd</text>

    <!-- grid lines -->
    <line class="grid" x1="167" y1="-25" x2="167" y2="85"/>
    <line class="grid" x1="284" y1="-25" x2="284" y2="85"/>
    <line class="grid" x1="401" y1="-25" x2="401" y2="85"/>
    <line class="grid" x1="518" y1="-25" x2="518" y2="85"/>
    <line class="grid" x1="635" y1="-25" x2="635" y2="85"/>

    <!-- vCA: -Vd(0-60), -Vd(60-120), 0(120-180), +Vd(180-240), +Vd(240-300), 0(300-360) -->
    <path class="wave-ca" d="M50,80 L167,80 L167,80 L284,80 L284,30 L401,30 L401,-20 L518,-20 L518,-20 L635,-20 L635,30 L750,30"/>
  </g>

  <!-- 360° label -->
  <text class="small" x="740" y="510">360°</text>
</svg>