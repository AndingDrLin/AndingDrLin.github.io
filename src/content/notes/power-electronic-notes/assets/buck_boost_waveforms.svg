<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-label="Inverting buck boost converter waveforms">
  <style>.axis{stroke:#222;stroke-width:2}.zero{stroke:#999;stroke-width:1.5;stroke-dasharray:5 4}.dash{stroke:#777;stroke-width:1.5;stroke-dasharray:6 5}.v{fill:none;stroke:#1565c0;stroke-width:3}.i{fill:none;stroke:#c62828;stroke-width:3}.txt{font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:#222}.small{font-size:13px}</style>
  <rect width="720" height="360" fill="white"/>
  <text class="txt" x="230" y="28">Inverting buck-boost (CCM): Vo = -D Vin / (1-D)</text>
  <line class="axis" x1="75" y1="160" x2="660" y2="160"/><line class="axis" x1="75" y1="55" x2="75" y2="175"/><line class="zero" x1="75" y1="115" x2="660" y2="115"/>
  <path class="v" d="M75,80 H220 V145 H370 V80 H515 V145 H660"/>
  <line class="dash" x1="220" y1="55" x2="220" y2="310"/><line class="dash" x1="370" y1="55" x2="370" y2="310"/><line class="dash" x1="515" y1="55" x2="515" y2="310"/>
  <text class="small txt" x="92" y="75">v_L = Vin</text><text class="small txt" x="238" y="152">v_L = Vo (negative)</text>
  <line class="axis" x1="75" y1="300" x2="660" y2="300"/><line class="axis" x1="75" y1="200" x2="75" y2="315"/>
  <path class="i" d="M75,280 L220,220 L370,280 L515,220 L660,280"/>
  <text class="small txt" x="92" y="218" fill="#c62828">on: inductor charges from source</text><text class="small txt" x="385" y="275" fill="#c62828">off: inductor discharges to output</text>
  <text class="small txt" x="130" y="335">DT</text><text class="small txt" x="280" y="335">(1-D)T</text><text class="txt" x="620" y="325">t</text>
</svg>
