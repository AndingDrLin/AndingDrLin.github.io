<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-label="SCR phase control firing angle">
  <style>.axis{stroke:#222;stroke-width:2}.in{fill:none;stroke:#aaa;stroke-width:2}.out{fill:none;stroke:#1565c0;stroke-width:4}.dash{stroke:#c62828;stroke-width:2;stroke-dasharray:6 5}.txt{font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#222}.small{font-size:14px}</style>
  <rect width="720" height="360" fill="white"/>
  <line class="axis" x1="70" y1="180" x2="665" y2="180"/>
  <line class="axis" x1="70" y1="50" x2="70" y2="305"/>
