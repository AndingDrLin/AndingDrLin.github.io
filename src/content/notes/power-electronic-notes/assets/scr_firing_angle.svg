  <text class="txt small" x="365" y="205">2pi</text>
  <text class="txt small" x="535" y="92" fill="#1565c0">conducts only after gate pulse</text>
  <text class="txt" x="600" y="205">omega t</text>
  <text class="txt" x="25" y="65">v</text>
</svg>
